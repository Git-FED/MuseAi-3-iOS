name: DesktopBuddy
options:
  deploymentTarget:
    iOS: "17.0"
    macOS: "14.0"
    watchOS: "10.0"
  createIntermediateGroups: true
  groupSortPosition: top
settings:
  base:
    SWIFT_VERSION: 5.9
    DEVELOPMENT_TEAM: ""
    PRODUCT_BUNDLE_IDENTIFIER: com.fedos.desktopbuddy
    MARKETING_VERSION: 1.0.0
    CURRENT_PROJECT_VERSION: 1
packages: {}
targets:
  DesktopBuddy-iOS:
    type: application
    platform: iOS
    sources:
      - path: DesktopBuddyShared
      - path: DesktopBuddyApple
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.fedos.desktopbuddy.ios
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_KEY_CFBundleDisplayName: Desktop Buddy
        INFOPLIST_KEY_NSCameraUsageDescription: Desktop Buddy does not use the camera.
        INFOPLIST_KEY_NSAppTransportSecurity_NSAllowsArbitraryLoads: false
        TARGETED_DEVICE_FAMILY: "1,2"
    info:
      path: DesktopBuddyApple/Info.plist
    scheme:
      testTargets: []
  DesktopBuddy-macOS:
    type: application
    platform: macOS
    sources:
      - path: DesktopBuddyShared
      - path: DesktopBuddyApple
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.fedos.desktopbuddy.macos
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_KEY_CFBundleDisplayName: Desktop Buddy
        INFOPLIST_KEY_NSAppTransportSecurity_NSAllowsArbitraryLoads: false
        ENABLE_HARDENED_RUNTIME: true
    info:
      path: DesktopBuddyApple/Info.plist
    scheme:
      testTargets: []
  DesktopBuddy-watchOS:
    type: application
    platform: watchOS
    sources:
      - path: DesktopBuddyShared
      - path: DesktopBuddyWatch
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.fedos.desktopbuddy.watchkitapp
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_KEY_CFBundleDisplayName: Desktop Buddy
        WKCompanionAppBundleIdentifier: com.fedos.desktopbuddy.ios
        WKWatchKitApp: true
    info:
      path: DesktopBuddyWatch/Info.plist
    scheme:
      testTargets: []

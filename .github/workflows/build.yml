name: Build Desktop Buddy Apple apps

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build iPhone/iPad, macOS, and watchOS
    runs-on: macos-15
    timeout-minutes: 45

    defaults:
      run:
        shell: bash

    env:
      HOMEBREW_NO_AUTO_UPDATE: "1"

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: "16.4"

      - name: Show selected Xcode and SDKs
        run: |
          set -euo pipefail

          xcode-select -p
          xcodebuild -version
          xcodebuild -showsdks

      - name: Install XcodeGen
        run: |
          set -euo pipefail

          if ! command -v xcodegen >/dev/null 2>&1; then
            brew install xcodegen
          fi

          xcodegen --version

      # Applies the earlier Swift correction to the CI working copy.
      # Existing direct UUID conversions are left unchanged.
      - name: Fix website data store UUID argument
        run: |
          set -euo pipefail

          python3 <<'PY'
          from pathlib import Path

          path = Path("DesktopBuddyShared/MuseWebView.swift")

          if not path.is_file():
              raise SystemExit(f"Required source file not found: {path}")

          source = path.read_text(encoding="utf-8")

          old = "WKWebsiteDataStore(forIdentifier: session.id)"

          new = """WKWebsiteDataStore(forIdentifier: {
              guard let identifier = UUID(uuidString: session.id) else {
                  preconditionFailure("Session ID must be a valid UUID string")
              }
              return identifier
          }())"""

          if old in source:
              source = source.replace(old, new)

              if "import Foundation" not in source:
                  source = "import Foundation\n" + source

              path.write_text(source, encoding="utf-8")
              print(f"Applied String-to-UUID correction in {path}")
          else:
              print(
                  "Original String argument expression is absent; "
                  "leaving existing source unchanged."
              )
          PY

      # Rebuilds only the watch app's icon catalog.
      # Uses existing square PNG artwork, not a placeholder.
      - name: Repair watchOS app icon catalog
        run: |
          set -euo pipefail

          python3 <<'PY'
          import json
          import subprocess
          import tempfile
          from pathlib import Path

          watch_catalog = Path(
              "DesktopBuddyWatch/Assets.xcassets/AppIcon.appiconset"
          )

          source_catalogs = [
              watch_catalog,
              Path("DesktopBuddyApple/Assets.xcassets/AppIcon.appiconset"),
          ]

          def image_dimensions(path):
              result = subprocess.run(
                  [
                      "sips",
                      "-g", "pixelWidth",
                      "-g", "pixelHeight",
                      str(path),
                  ],
                  check=True,
                  capture_output=True,
                  text=True,
              )

              dimensions = {}

              for line in result.stdout.splitlines():
                  key, separator, value = line.strip().partition(":")

                  if separator and key in ("pixelWidth", "pixelHeight"):
                      dimensions[key] = int(value.strip())

              return (
                  dimensions.get("pixelWidth", 0),
                  dimensions.get("pixelHeight", 0),
              )

          candidates = []

          for catalog in source_catalogs:
              if not catalog.is_dir():
                  continue

              for image in catalog.glob("*.png"):
                  try:
                      width, height = image_dimensions(image)
                  except (subprocess.CalledProcessError, ValueError):
                      continue

                  if width > 0 and width == height:
                      candidates.append((width, image))

          if not candidates:
              raise SystemExit(
                  "No square PNG artwork found in the watch or Apple "
                  "AppIcon catalog. Add your app icon PNG and rerun."
              )

          source_size, source_path = max(
              candidates,
              key=lambda candidate: candidate[0],
          )

          print(
              f"Using existing artwork: {source_path} "
              f"({source_size}x{source_size})"
          )

          if source_size < 1024:
              print(
                  "::warning::Source artwork is smaller than 1024x1024. "
                  "It will be upscaled. Use high-resolution artwork "
                  "for a release build."
              )

          slots = [
              {
                  "size": "24x24",
                  "scale": "2x",
                  "role": "notificationCenter",
                  "subtype": "38mm",
                  "pixels": 48,
              },
              {
                  "size": "27.5x27.5",
                  "scale": "2x",
                  "role": "notificationCenter",
                  "subtype": "42mm",
                  "pixels": 55,
              },
              {
                  "size": "29x29",
                  "scale": "2x",
                  "role": "companionSettings",
                  "pixels": 58,
              },
              {
                  "size": "29x29",
                  "scale": "3x",
                  "role": "companionSettings",
                  "pixels": 87,
              },
              {
                  "size": "40x40",
                  "scale": "2x",
                  "role": "appLauncher",
                  "subtype": "38mm",
                  "pixels": 80,
              },
              {
                  "size": "44x44",
                  "scale": "2x",
                  "role": "appLauncher",
                  "subtype": "40mm",
                  "pixels": 88,
              },
              {
                  "size": "50x50",
                  "scale": "2x",
                  "role": "appLauncher",
                  "subtype": "44mm",
                  "pixels": 100,
              },
              {
                  "size": "86x86",
                  "scale": "2x",
                  "role": "quickLook",
                  "subtype": "38mm",
                  "pixels": 172,
              },
              {
                  "size": "98x98",
                  "scale": "2x",
                  "role": "quickLook",
                  "subtype": "42mm",
                  "pixels": 196,
              },
              {
                  "size": "108x108",
                  "scale": "2x",
                  "role": "quickLook",
                  "subtype": "44mm",
                  "pixels": 216,
              },
          ]

          watch_catalog.mkdir(parents=True, exist_ok=True)

          with tempfile.TemporaryDirectory() as temporary_directory:
              source_copy = Path(temporary_directory) / "source.png"
              source_copy.write_bytes(source_path.read_bytes())

              entries = []

              for slot in slots:
                  pixels = slot["pixels"]
                  role = slot["role"]
                  subtype = slot.get("subtype", "settings")
                  scale = slot["scale"]

                  filename = f"WatchIcon-{role}-{subtype}-{scale}.png"

                  subprocess.run(
                      [
                          "sips",
                          "-s", "format", "png",
                          "-z", str(pixels), str(pixels),
                          str(source_copy),
                          "--out", str(watch_catalog / filename),
                      ],
                      check=True,
                      capture_output=True,
                      text=True,
                  )

                  entry = {
                      key: value
                      for key, value in slot.items()
                      if key != "pixels"
                  }

                  entry["idiom"] = "watch"
                  entry["filename"] = filename
                  entries.append(entry)

              marketing_filename = "WatchIcon-Marketing-1024.png"

              subprocess.run(
                  [
                      "sips",
                      "-s", "format", "png",
                      "-z", "1024", "1024",
                      str(source_copy),
                      "--out",
                      str(watch_catalog / marketing_filename),
                  ],
                  check=True,
                  capture_output=True,
                  text=True,
              )

              entries.append(
                  {
                      "idiom": "watch-marketing",
                      "size": "1024x1024",
                      "scale": "1x",
                      "filename": marketing_filename,
                  }
              )

              contents = {
                  "images": entries,
                  "info": {
                      "author": "xcode",
                      "version": 1,
                  },
              }

              (watch_catalog / "Contents.json").write_text(
                  json.dumps(contents, indent=2) + "\n",
                  encoding="utf-8",
              )

              referenced_files = {
                  entry["filename"] for entry in entries
              }

              for image in watch_catalog.glob("*.png"):
                  if image.name not in referenced_files:
                      image.unlink()

          print(
              f"Rebuilt {watch_catalog} with "
              f"{len(entries)} watchOS icon entries."
          )
          PY

      - name: Generate Xcode project
        run: |
          set -euo pipefail

          xcodegen generate

      - name: Build iPhone and iPad iOS simulator app
        run: |
          set -euo pipefail
          mkdir -p logs

          xcodebuild \
            -project DesktopBuddy.xcodeproj \
            -scheme DesktopBuddy-iOS \
            -sdk iphonesimulator \
            -destination "generic/platform=iOS Simulator" \
            -configuration Debug \
            -derivedDataPath build/ios \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            build \
            2>&1 | tee logs/ios-build.log

      - name: Build macOS app
        run: |
          set -euo pipefail
          mkdir -p logs

          xcodebuild \
            -project DesktopBuddy.xcodeproj \
            -scheme DesktopBuddy-macOS \
            -sdk macosx \
            -destination "generic/platform=macOS" \
            -configuration Debug \
            -derivedDataPath build/macos \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            build \
            2>&1 | tee logs/macos-build.log

      - name: Build watchOS simulator app
        run: |
          set -euo pipefail
          mkdir -p logs

          xcodebuild \
            -project DesktopBuddy.xcodeproj \
            -scheme DesktopBuddy-watchOS \
            -sdk watchsimulator \
            -destination "generic/platform=watchOS Simulator" \
            -configuration Debug \
            -derivedDataPath build/watchos \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            build \
            2>&1 | tee logs/watchos-build.log

      - name: Package unsigned build products
        run: |
          set -euo pipefail
          mkdir -p artifacts

          package_app() {
            local app_path="$1"
            local zip_path="$2"

            if [[ ! -d "$app_path" ]]; then
              echo "::error::Expected app bundle not found: $app_path"
              echo "Available app bundles:"
              find build -type d -name "*.app" -prune -print
              return 1
            fi

            ditto \
              -c \
              -k \
              --sequesterRsrc \
              --keepParent \
              "$app_path" \
              "$zip_path"
          }

          package_app \
            "build/ios/Build/Products/Debug-iphonesimulator/DesktopBuddy-iOS.app" \
            "artifacts/DesktopBuddy-iOS-simulator.zip"

          package_app \
            "build/macos/Build/Products/Debug/DesktopBuddy-macOS.app" \
            "artifacts/DesktopBuddy-macOS.zip"

          package_app \
            "build/watchos/Build/Products/Debug-watchsimulator/DesktopBuddy-watchOS.app" \
            "artifacts/DesktopBuddy-watchOS-simulator.zip"

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: desktop-buddy-apple-builds
          path: artifacts/*.zip
          if-no-files-found: error
          retention-days: 14

      - name: Upload build logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: desktop-buddy-build-logs
          path: logs/*.log
          if-no-files-found: ignore
          retention-days: 14

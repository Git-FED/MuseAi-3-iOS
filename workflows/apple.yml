name: Apple build
on:
  push:
  pull_request:
jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate Xcode project
        run: xcodegen generate
      - name: Build iOS simulator target
        run: xcodebuild -project DesktopBuddy.xcodeproj -scheme DesktopBuddy-iOS -sdk iphonesimulator -configuration Debug CODE_SIGNING_ALLOWED=NO build
      - name: Build macOS target
        run: xcodebuild -project DesktopBuddy.xcodeproj -scheme DesktopBuddy-macOS -sdk macosx -configuration Debug CODE_SIGNING_ALLOWED=NO build
      - name: Validate watchOS target
        run: xcodebuild -project DesktopBuddy.xcodeproj -scheme DesktopBuddy-watchOS -sdk watchsimulator -configuration Debug CODE_SIGNING_ALLOWED=NO build
